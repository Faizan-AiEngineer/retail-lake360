services:
  # ==============================================================================
  # MySQL 8.4 LTS Enterprise Database Service
  # Hosts retaillake_source, retaillake_serving, and retaillake_metadata
  # ==============================================================================
  mysql:
    image: mysql:8.4
    container_name: retaillake-mysql-84
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_SOURCE_PASSWORD: ${MYSQL_SOURCE_PASSWORD:?Set MYSQL_SOURCE_PASSWORD in .env}
      MYSQL_PIPELINE_PASSWORD: ${MYSQL_PIPELINE_PASSWORD:?Set MYSQL_PIPELINE_PASSWORD in .env}
      MYSQL_ANALYTICS_PASSWORD: ${MYSQL_ANALYTICS_PASSWORD:?Set MYSQL_ANALYTICS_PASSWORD in .env}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - retaillake-net

  # ==============================================================================
  # Streamlit Analytics Dashboard Service
  # Connects to MySQL Serving Layer with strictly read-only analytics_user
  # ==============================================================================
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: retaillake-dashboard
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_SERVING_DB: ${MYSQL_SERVING_DB:-retaillake_serving}
      MYSQL_METADATA_DB: ${MYSQL_METADATA_DB:-retaillake_metadata}
      MYSQL_ANALYTICS_USER: ${MYSQL_ANALYTICS_USER:-analytics_user}
      MYSQL_ANALYTICS_PASSWORD: ${MYSQL_ANALYTICS_PASSWORD:?Set MYSQL_ANALYTICS_PASSWORD in .env}
      STREAMLIT_SERVER_PORT: 8501
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./src/dashboard:/app/src/dashboard:ro
      - ./config:/app/config:ro
    networks:
      - retaillake-net

  # ==============================================================================
  # Airflow Init Service
  # ==============================================================================
  airflow-init:
    image: apache/airflow:2.8.1-python3.10
    container_name: retaillake-airflow-init
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USER:?Set AIRFLOW_USER in .env}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:?Set AIRFLOW_PASSWORD in .env}
    volumes:
      - airflow_state:/opt/airflow
    networks:
      - retaillake-net

  # ==============================================================================
  # Airflow Webserver
  # ==============================================================================
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: retaillake-airflow-webserver
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_SOURCE_DB: ${MYSQL_SOURCE_DB:-retaillake_source}
      MYSQL_SERVING_DB: ${MYSQL_SERVING_DB:-retaillake_serving}
      MYSQL_METADATA_DB: ${MYSQL_METADATA_DB:-retaillake_metadata}
      MYSQL_SOURCE_PASSWORD: ${MYSQL_SOURCE_PASSWORD:?Set MYSQL_SOURCE_PASSWORD in .env}
      MYSQL_PIPELINE_USER: ${MYSQL_PIPELINE_USER:-pipeline_user}
      MYSQL_PIPELINE_PASSWORD: ${MYSQL_PIPELINE_PASSWORD:?Set MYSQL_PIPELINE_PASSWORD in .env}
      LAKEHOUSE_STORAGE_BASE: /app/lakehouse
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/app/src
      - ./config:/app/config
      - ./lakehouse:/app/lakehouse
      - airflow_state:/opt/airflow
      - airflow_logs:/opt/airflow/logs
    networks:
      - retaillake-net

  # ==============================================================================
  # Airflow Scheduler
  # ==============================================================================
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: retaillake-airflow-scheduler
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_SOURCE_DB: ${MYSQL_SOURCE_DB:-retaillake_source}
      MYSQL_SERVING_DB: ${MYSQL_SERVING_DB:-retaillake_serving}
      MYSQL_METADATA_DB: ${MYSQL_METADATA_DB:-retaillake_metadata}
      MYSQL_SOURCE_PASSWORD: ${MYSQL_SOURCE_PASSWORD:?Set MYSQL_SOURCE_PASSWORD in .env}
      MYSQL_PIPELINE_USER: ${MYSQL_PIPELINE_USER:-pipeline_user}
      MYSQL_PIPELINE_PASSWORD: ${MYSQL_PIPELINE_PASSWORD:?Set MYSQL_PIPELINE_PASSWORD in .env}
      LAKEHOUSE_STORAGE_BASE: /app/lakehouse
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/app/src
      - ./config:/app/config
      - ./lakehouse:/app/lakehouse
      - airflow_state:/opt/airflow
      - airflow_logs:/opt/airflow/logs
    networks:
      - retaillake-net

volumes:
  mysql_data:
    driver: local
  airflow_state:
    driver: local
  airflow_logs:
    driver: local

networks:
  retaillake-net:
    driver: bridge
